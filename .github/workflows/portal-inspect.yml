name: Portal Structure Inspection

on:
  push:
    branches:
      - preorder-foundation

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract relevant portal sections
        shell: bash
        run: |
          set -e
          FILE="app/routes/portal._index.tsx"
          {
            echo "=== FILE STATS ==="
            wc -l -c "$FILE"
            echo
            echo "=== LOADER USER/PAGE ACCESS 500-560 ==="
            sed -n '500,560p' "$FILE"
            echo
            echo "=== LOADER RETURN 1020-1130 ==="
            sed -n '1020,1130p' "$FILE"
            echo
            echo "=== PORTAL USER TYPES/CONSTANTS 6650-6950 ==="
            sed -n '6650,6950p' "$FILE"
            echo
            echo "=== COOKIE CURRENT USER 8440-8550 ==="
            sed -n '8440,8550p' "$FILE"
            echo
            echo "=== CLIENT NAV 10780-11220 ==="
            sed -n '10780,11220p' "$FILE"
            echo
            echo "=== SIDEBAR AND PAGE RENDERER 11220-11820 ==="
            sed -n '11220,11820p' "$FILE"
            echo
            echo "=== SETTINGS USER PERMISSIONS 23420-23720 ==="
            sed -n '23420,23720p' "$FILE"
          } > portal-inspection.txt
      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: portal-inspection-ranges
          path: portal-inspection.txt
          retention-days: 1
