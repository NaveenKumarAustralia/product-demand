name: Apply Shopify Preorder Readiness Panel
on:
  push:
    branches: [preorder-phase8-shopify-readiness]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message != 'Wire Shopify preorder readiness panel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preorder-phase8-shopify-readiness
      - run: node scripts/apply-preorder-readiness-panel.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/portal-preorders.tsx
          git commit -m 'Wire Shopify preorder readiness panel'
          git push origin HEAD:preorder-phase8-shopify-readiness
