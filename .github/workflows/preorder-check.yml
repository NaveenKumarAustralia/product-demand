name: Preorder Development Check

on:
  push:
    branches:
      - preorder-foundation
  pull_request:
    branches:
      - main

concurrency:
  group: preorder-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Preorder rule tests
        run: npm run test:preorder

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
