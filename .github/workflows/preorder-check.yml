name: Preorder Development Check

on:
  push:
    branches:
      - preorder-foundation
  pull_request:
    branches:
      - main

concurrency:
  group: preorder-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Preorder rule tests
        run: npm run test:preorder

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preorder-validation-logs
          path: |
            typecheck.log
            build.log
          if-no-files-found: ignore
          retention-days: 1
