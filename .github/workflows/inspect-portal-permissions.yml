name: Inspect Portal Permission Settings
on:
  workflow_dispatch:
  push:
    branches: [preorder-phase6-notifications]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect user permission code
        run: |
          echo '=== PortalUser ==='
          grep -n -A25 -B5 'type PortalUser' app/routes/portal._index.tsx || true
          echo '=== UserEditForm ==='
          grep -n -A180 -B20 'function UserEditForm' app/routes/portal._index.tsx || true
          echo '=== save user actions ==='
          grep -n -A100 -B20 -E 'save.*user|update.*user|portal_users|pageAccess' app/routes/portal._index.tsx | head -n 700 || true
