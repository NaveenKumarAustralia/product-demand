name: Apply Preorder Portal Patch

on:
  push:
    branches:
      - preorder-foundation
    paths:
      - scripts/apply-preorders-portal-patch.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preorder-foundation
      - name: Apply deterministic patch
        id: apply
        shell: bash
        run: |
          set +e
          node scripts/apply-preorders-portal-patch.mjs > patch.log 2>&1
          code=$?
          cat patch.log
          exit $code
      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preorder-portal-patch-log
          path: patch.log
          retention-days: 1
      - name: Commit portal integration
        shell: bash
        run: |
          if git diff --quiet -- app/routes/portal._index.tsx; then
            echo "No portal changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/portal._index.tsx
          git commit -m "feat: integrate permission-controlled preorder portal page"
          git push origin HEAD:preorder-foundation
