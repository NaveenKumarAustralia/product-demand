name: Apply Preorder Activation UI
on:
  push:
    branches: [preorder-phase12-working]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message != 'Wire preorder Shopify activation controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preorder-phase12-working
      - run: node scripts/apply-preorder-activation-ui.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/portal-preorders.tsx
          git commit -m 'Wire preorder Shopify activation controls'
          git push origin HEAD:preorder-phase12-working
