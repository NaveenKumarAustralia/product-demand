<!--
  Karma East — pre-order note for the SHOPIFY ORDER CONFIRMATION email.
  Static: shown on EVERY order (no detection logic, so it can never misfire).
  It only *applies* if the customer bought a pre-order item — everyone else
  simply ignores it. The specific item + dispatch date comes in the separate
  Klaviyo "Pre-order Placed" email.

  Paste this where you want it in your Shopify confirmation email (e.g. just
  below the order summary), and DELETE the old teal "Pre-order" detection block
  (the {% if %}...{% endif %} chunk) — the Klaviyo email replaces it.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:16px 0;">
  <tr>
    <td style="background:#eef4f4;border-left:4px solid #006061;padding:14px 18px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.6;color:#33413f;">
      <strong style="color:#006061;">Ordered a pre-order piece?</strong> If your order includes a pre-order item, you'll receive a separate email shortly with its estimated dispatch date. Any in-stock items in your order are on their way now.
    </td>
  </tr>
</table>
