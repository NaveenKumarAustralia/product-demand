# This file stores configurations for your Shopify app.
name = "Product Demand"
client_id = "96e96c6bb0e33380b852c0df2d0fd82b"
application_url = "https://product-demand-production.up.railway.app/auth-portal"
embedded = true

[auth]
redirect_urls = [
  "https://product-demand-production.up.railway.app/auth/callback",
  "https://product-demand-production.up.railway.app/auth/shopify/callback",
  "https://product-demand-production.up.railway.app/api/auth/callback"
]

[access_scopes]
scopes = "read_products,write_products,read_inventory,write_inventory,read_locations,read_orders,read_reports,read_purchase_options,write_purchase_options,read_all_orders,read_customer_payment_methods,read_payment_mandate,write_payment_mandate,write_app_proxy"

[app_proxy]
# Must be an ABSOLUTE URL — Shopify forwards storefront /apps/karma-east-preorder
# requests here. A relative "/preorder-proxy" leaves Shopify with nowhere to
# proxy to, so the storefront block's fetch fails and the block stays hidden.
url = "https://product-demand-production.up.railway.app/preorder-proxy"
prefix = "apps"
subpath = "karma-east-preorder"

[webhooks]
api_version = "2025-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

# Preorder order lifecycle subscriptions are shop-specific and are kept in
# sync by scripts/register-preorder-webhooks.mjs during Railway startup. This
# avoids duplicate app-specific subscriptions and does not require a separate
# Shopify CLI deployment for these three order topics.
